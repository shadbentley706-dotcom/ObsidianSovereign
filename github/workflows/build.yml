name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the mod files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge 1.20.1 MDK
        run: |
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          DIR=$(dirname "$(find mdk -maxdepth 2 -name gradlew | head -n1)")
          echo "MDK_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Put the mod into the MDK
        run: |
          rm -rf "$MDK_DIR/src"
          cp -r src "$MDK_DIR/src"
          cd "$MDK_DIR"
          sed -i 's/^mod_id=.*/mod_id=obsidiansovereign/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=The Obsidian Sovereign/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.obsidiansovereign/' gradle.properties
          chmod +x gradlew

      - name: Build the jar
        run: |
          cd "$MDK_DIR"
          ./gradlew build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianSovereign-jar
          path: ${{ env.MDK_DIR }}/build/libs/*.jar
